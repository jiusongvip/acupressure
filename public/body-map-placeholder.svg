<svg width="400" height="700" viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="700" fill="#fafaf9" rx="16"/>
  <title>Acupressure Body Map</title>
  <desc>Human body outline with acupressure point regions: Head, Face, Neck, Shoulder, Hand, Chest, Abdomen, Back, Leg, Foot</desc>

  <!-- Head -->
  <ellipse cx="200" cy="55" rx="48" ry="55" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="182" y="105" width="36" height="35" rx="6" fill="rgba(5,150,105,0.06)" stroke="#059669" stroke-width="1"/>

  <!-- Shoulders -->
  <path d="M100 140 C80 135, 50 140, 40 150 L40 165 C50 160, 80 155, 100 155 Z" fill="rgba(5,150,105,0.06)" stroke="#059669" stroke-width="1"/>
  <path d="M300 140 C320 135, 350 140, 360 150 L360 165 C350 160, 320 155, 300 155 Z" fill="rgba(5,150,105,0.06)" stroke="#059669" stroke-width="1"/>

  <!-- Torso -->
  <path d="M130 140 L130 340 C130 350, 140 355, 160 355 L240 355 C260 355, 270 350, 270 340 L270 140 Z" fill="rgba(5,150,105,0.04)" stroke="#a8a29e" stroke-width="1.5"/>

  <!-- Chest line -->
  <line x1="140" y1="190" x2="260" y2="190" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Abdomen line -->
  <line x1="140" y1="270" x2="260" y2="270" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Left Arm -->
  <path d="M100 155 L65 200 L55 230 L50 270 L50 290 C50 295, 55 300, 65 300 L75 300 C85 300, 85 295, 85 285 L85 250 L95 210 L130 170" fill="rgba(5,150,105,0.04)" stroke="#a8a29e" stroke-width="1.5"/>

  <!-- Right Arm -->
  <path d="M300 155 L335 200 L345 230 L350 270 L350 290 C350 295, 345 300, 335 300 L325 300 C315 300, 315 295, 315 285 L315 250 L305 210 L270 170" fill="rgba(5,150,105,0.04)" stroke="#a8a29e" stroke-width="1.5"/>

  <!-- Left Hand -->
  <rect x="40" y="295" width="40" height="30" rx="6" fill="rgba(5,150,105,0.06)" stroke="#059669" stroke-width="1"/>

  <!-- Right Hand -->
  <rect x="320" y="295" width="40" height="30" rx="6" fill="rgba(5,150,105,0.06)" stroke="#059669" stroke-width="1"/>

  <!-- Left Leg -->
  <path d="M150 355 L140 500 L138 530 C138 545, 145 560, 155 560 L170 560 L180 500 L185 355" fill="rgba(5,150,105,0.04)" stroke="#a8a29e" stroke-width="1.5"/>

  <!-- Right Leg -->
  <path d="M250 355 L260 500 L262 530 C262 545, 255 560, 245 560 L230 560 L220 500 L215 355" fill="rgba(5,150,105,0.04)" stroke="#a8a29e" stroke-width="1.5"/>

  <!-- Left Foot -->
  <rect x="130" y="555" width="55" height="28" rx="8" fill="rgba(5,150,105,0.06)" stroke="#059669" stroke-width="1"/>

  <!-- Right Foot -->
  <rect x="215" y="555" width="55" height="28" rx="8" fill="rgba(5,150,105,0.06)" stroke="#059669" stroke-width="1"/>

  <!-- Region Labels -->
  <g font-family="system-ui,sans-serif" font-size="11" fill="#059669" font-weight="600" text-anchor="middle">
    <text x="200" y="38">Head</text>
    <text x="200" y="128">Neck</text>
    <text x="200" y="163">Chest</text>
    <text x="200" y="248">Abdomen</text>
    <text x="200" y="340">—</text>
    <text x="60" y="317">Hand</text>
    <text x="340" y="317">Hand</text>
    <text x="200" y="460">Leg</text>
    <text x="158" y="575">Foot</text>
    <text x="243" y="575">Foot</text>
    <text x="75" y="148">Shoulder</text>
    <text x="325" y="148">Shoulder</text>
  </g>

  <!-- Acupoint dots -->
  <circle cx="200" cy="55" r="3" fill="#059669" opacity="0.5"/>
  <circle cx="200" cy="155" r="3" fill="#059669" opacity="0.5"/>
  <circle cx="170" cy="220" r="3" fill="#059669" opacity="0.5"/>
  <circle cx="230" cy="220" r="3" fill="#059669" opacity="0.5"/>
  <circle cx="200" cy="310" r="3" fill="#059669" opacity="0.5"/>
  <circle cx="60" cy="270" r="3" fill="#059669" opacity="0.5"/>
  <circle cx="340" cy="270" r="3" fill="#059669" opacity="0.5"/>
  <circle cx="165" cy="420" r="3" fill="#059669" opacity="0.5"/>
  <circle cx="235" cy="420" r="3" fill="#059669" opacity="0.5"/>
  <circle cx="165" cy="510" r="3" fill="#059669" opacity="0.5"/>
  <circle cx="235" cy="510" r="3" fill="#059669" opacity="0.5"/>

  <!-- CTA -->
  <text x="200" y="640" font-family="system-ui,sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle">Interactive body map coming soon</text>
  <text x="200" y="660" font-family="system-ui,sans-serif" font-size="10" fill="#d6d3d1" text-anchor="middle">Tap a body region to explore points</text>
</svg>
